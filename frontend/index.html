<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <title>Audio Summarizer</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200..800&family=Noto+Sans+Hebrew:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
    :root{
        /* צבעים מרכזיים */
        --bg-page: #b0f1e7;
        --accent: #ff2167;
        --accent-hover: #e01b5a;
        --text-muted: #555;
        --text-accent: #00796b;
    }

    /* בסיסי */
    html,body{
        height:100%;
        margin:0;
        padding:0;
        box-sizing:border-box;
    }
    *,*::before,*::after{ box-sizing:inherit; }

    body{
        font-family: "Assistant", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        direction: rtl;
        background-color: var(--bg-page);
        min-height:100vh;
        color:#222;
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
    }

    /* כותרת ראשית */
    h1{
        font-family: "Rubik", "Assistant", sans-serif;
        color:#fff;
        font-weight:900;
        text-shadow:2px 2px 4px rgba(0,0,0,0.45);
        margin:0 0 1rem 0;
        text-align:center;
    }

    /* כפתור העלאה */
    #upload-btn{
        display:inline-block;
        width:100%;
        background-color:var(--accent);
        color:#fff;
        border:0;
        padding:.9rem 1rem;
        font-size:1.05rem;
        font-weight:700;
        border-radius:6px;
        cursor:pointer;
        transition: transform .18s ease, background-color .18s ease;
    }
    #upload-btn:hover{ transform:scale(1.03); background-color:var(--accent-hover); }

    /* סטטוס טקסט */
    #status-message{
        margin-top:.75rem;
        text-align:center;
        color:var(--text-muted);
        font-size:0.95rem;
    }

    /* ====== Progress bar ====== */
    #progress-wrapper{
        margin-top:1rem;
        display:none; /* מוסתר בהתחלה */
    }
    .progress{
        height:25px;
        background-color:#eee;
        border-radius:6px;
        overflow:hidden;
    }
    #progress-bar{
        background-color:var(--accent);
        color:#fff;
        font-weight:700;
        text-align:center;
        line-height:25px;
        transition:width .3s ease;
    }
    #progressTime{
        font-weight:700;
        color:var(--text-accent);
        font-size:0.95rem;
        margin-top:.5rem;
        display:inline-block;
    }
    #progressLabel{
        color:var(--text-muted);
        font-size:0.9rem;
        margin-top:.5rem;
        display:inline-block;
    }

    /* ====== Summary container & download ====== */
    #summary-container{
        margin-top:1.25rem;
        background:#fff;
        border-radius:8px;
        box-shadow:0 6px 18px rgba(0,0,0,0.08);
        display:none; /* מוסתר בהתחלה */
        animation: fadeIn .9s ease both;
        overflow:hidden;
    }
    #summary-container .card-header{
        background-color:#00CED1;
        color:#fff;
        font-weight:700;
        font-size:0.95rem;
        padding:.6rem 1rem;
    }
    #summary-container .card-body{ padding:1rem; color:#222; }
    #download-btn{
        background:var(--accent);
        color:#fff;
        border:0;
        padding:.5rem .75rem;
        border-radius:6px;
        cursor:pointer;
    }
    #download-btn:hover{ background:var(--accent-hover); transform:scale(1.02); }

    /* אנימציה */
    @keyframes fadeIn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }

    /* רספונסיבי */
    @media (max-width:420px){
        #upload-btn{ padding:.75rem; font-size:1rem; }
        #progressTime, #progressLabel{ font-size:0.85rem; }
    }
</style>


</head>

<body class="container-sm py-4">
  <h1 class="mb-4 text-center">🎧 העלאת קובץ שמע</h1>

  <div class="mb-3">
    <input type="file" id="file-upload" accept="audio/*" class="form-control" />
  </div>
  <button id="upload-btn" class="btn btn-lg w-100">העלה</button>
  <div id="status-message" class="mt-3 text-muted text-center"></div>

  <!-- ======= Progress bar במקום גלגל ======= -->
  <div id="progress-wrapper" class="my-3" style="display:none;" role="status" aria-live="polite">
      <div class="progress" style="height: 25px;">
          <div id="progress-bar" class="progress-bar" role="progressbar"
               style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
              0%
          </div>
      </div>
      <div class="text-center mt-2">
          <span id="progressTime">--:--</span> | <span id="progressLabel">ממתין לעיבוד</span>
      </div>
  </div>


  <div id="summary-container" class="card shadow mt-4">
    <div class="card-header text-end text-secondary" style="font-size:14px; background-color:#b0f1e7;">
      סיכום התוכן של הקובץ שמע שהועלה
    </div>
    <div class="card-body">
      <div id="summary-text"></div>
      <button id="download-btn" class="btn mt-3">📄 הורד כ‑PDF</button>
    </div>
  </div>
<!-- ======= טעינת סקריפטים (פעם אחת בלבד) ======= -->
<!-- upload.js נטען אחרי האלמנטים -->
<script src="upload.js"></script>

<!-- ספריות נוספות (טען אותן פעם אחת בלבד) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="font-loader.js"></script>

<!-- ======= אתחול fallback, חיבור כפתור וחשיפת setProgress ======= -->
  <script>
      (function () {
          if (window.__progressInitDone) {
              console.debug('Progress init already done');
              return;
          }
          window.__progressInitDone = true;

          function $id(id) { return document.getElementById(id); }

          function initProgressFallback() {
              const bar = $id('progress-bar');
              const wrapper = $id('progress-wrapper');
              if (!bar) return;
              bar.style.width = '0%';
              bar.textContent = '0%';
              if (wrapper) wrapper.style.display = 'none';
              console.debug('Progress fallback initialized');
          }

          if (document.readyState === 'complete' || document.readyState === 'interactive') {
              setTimeout(initProgressFallback, 0);
          } else {
              document.addEventListener('DOMContentLoaded', initProgressFallback);
          }

          function attachUploadBtn() {
              const uploadBtn = $id('upload-btn');
              if (!uploadBtn) return;
              if (uploadBtn.dataset.uploadBtnAttached) return;
              uploadBtn.dataset.uploadBtnAttached = '1';

              uploadBtn.addEventListener('click', () => {
                  const summaryContainer = $id('summary-container');
                  if (summaryContainer) summaryContainer.style.display = 'none';
                  if (typeof updateStatus === 'function') updateStatus("מתחיל העלאה ועיבוד...");
              });
          }

          if (document.readyState === 'complete' || document.readyState === 'interactive') {
              setTimeout(attachUploadBtn, 0);
          } else {
              document.addEventListener('DOMContentLoaded', attachUploadBtn);
          }

          // --- setProgress: עדכון progress bar ---
          function clamp(v) { return Math.max(0, Math.min(100, Number(v) || 0)); }

          /**
 * setProgress(pre, trans, sum, show, etaMinutes)
 * pre/trans/sum: ערכים "משוקללים" לכל שלב:
 *   - העלאה + עיבוד מקדים (pre): 0..40
 *   - תמלול + מיזוג (trans):     0..30
 *   - סיכום (sum):               0..30
 * ביחד הם אמורים לסכם ל‑0..100.
 *
 * show: אם true — הצג את הווידג'ט גם אם הערכים 0
 * etaMinutes: זמן משוער שמועבר מבחוץ
 */
function setProgress(pre = 0, trans = 0, sum = 0, show = false, etaMinutes = null) {
    pre = Number(pre) || 0;
    trans = Number(trans) || 0;
    sum = Number(sum) || 0;

    const totalPercent = clamp(pre + trans + sum);

    console.debug(">>> setProgress called", {
        prePct: pre,
        transPct: trans,
        sumPct: sum,
        totalPercent,
        show,
        etaMinutes
    });

    // --- עדכון progress bar ---
    const bar = $id('progress-bar');
    if (bar) {
        bar.style.width = totalPercent + '%';
        bar.setAttribute('aria-valuenow', totalPercent);
        bar.textContent = totalPercent + '%';
    }

    // --- ETA ---
    const timeEl = $id('progressTime');
    if (timeEl) {
        timeEl.textContent = etaMinutes !== null ? `${etaMinutes} דק'` : '—';
    }

    // --- טקסט מילולי מתחת לבר ---
    const labelEl = $id('progressLabel');
    let label = 'ממתין לעיבוד';

    /**
     * סדר עדיפויות:
     * 1. אם ETA = 0 בשלב הסיכום → "הסיכום מוכן"
     * 2. סיכום
     * 3. תמלול
     * 4. עיבוד מקדים
     */

    // --- אם ETA = 0 בשלב הסיכום → להציג מיד "הסיכום מוכן" ---
    if (sum > 0 && etaMinutes === 0) {
        label = 'הסיכום מוכן';
    }
    else if (sum > 0) {
        label = 'מכינים את הסיכום';
    }
    else if (trans > 0) {
        label = 'מתמללים את ההקלטה';
    }
    else if (pre >= 30) {
        label = 'עיבוד מקדים הושלם';
    }
    else if (pre > 10) {
        label = 'מכינים את הקובץ לעיבוד מקבילי';
    }
    else if (pre > 0) {
        label = 'מעבד מקטעים';
    }

    if (labelEl) labelEl.textContent = label;

    // --- הצגת הווידג'ט ---
    const wrapper = $id('progress-wrapper');
    if (wrapper) {
        wrapper.style.display = (show || totalPercent > 0) ? 'block' : 'none';
    }
}



          window.setProgress = setProgress;
      })();
  </script>

</body>
